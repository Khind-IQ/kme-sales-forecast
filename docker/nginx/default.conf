server {
    listen 80;
    index index.php index.html;
    root /var/www/public;

    # Compress text responses (forecast JSON, JS/CSS bundles); they shrink several times over.
    # http_version 1.0 because the host nginx proxies to this container over HTTP/1.0.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_http_version 1.0;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTPS 'on';

        # INCREASED Buffers
        fastcgi_buffers 256 128k;
        fastcgi_buffer_size 128k;
        fastcgi_busy_buffers_size 256k;

        fastcgi_max_temp_file_size 0;
    }

    location ~ /\.ht {
        deny all;
    }
}
