version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: kme-sales-forecast-app
    container_name: kme_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./storage:/var/www/storage
      - ./.env:/var/www/.env
      - ./public/build:/var/www/public/build
      - ./app:/var/www/app
      - ./routes:/var/www/routes
      - ./config:/var/www/config
      - ./database:/var/www/database
      - ./resources:/var/www/resources
    networks:
      - kme_network
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 10s
      retries: 3

  scheduler:
    image: kme-sales-forecast-app
    container_name: kme_scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: sh -c "while true; do php artisan schedule:run --verbose; sleep 60; done"
    volumes:
      - ./storage:/var/www/storage
      - ./.env:/var/www/.env
      - ./app:/var/www/app
      - ./routes:/var/www/routes
      - ./config:/var/www/config
      - ./database:/var/www/database
      - ./resources:/var/www/resources
    depends_on:
      - app
    networks:
      - kme_network

  web:
    image: nginx:stable-alpine
    container_name: kme_nginx
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./public:/var/www/public
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - kme_network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  kme_network:
    driver: bridge
    name: kme_network
